<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bulletin Board{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    nav a { margin-right: .75rem; }
    .post { border: 1px solid #8884; border-radius: 8px; padding: .75rem 1rem; margin-bottom: .75rem; }
    .post .meta { font-size: .8rem; opacity: .7; margin-bottom: .35rem; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: .5rem .75rem; border-radius: 6px; margin-bottom: .5rem; background: #8882; }
    textarea, input, select, button { font: inherit; width: 100%; box-sizing: border-box; padding: .5rem; margin: .25rem 0 .75rem; }
    button { width: auto; cursor: pointer; }
    .cats a { margin-right: .5rem; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'feed' %}"><strong>Bulletin Board</strong></a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'new_post' %}">New post</a>
        <a href="{% url 'my_posts' %}">My posts</a>
        <a href="{% url 'logout' %}">Log out</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}

  <footer style="margin-top:2rem; padding-top:1rem; border-top:1px solid #8884; font-size:.85rem; opacity:.8;">
    <a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">House rules</a>
  </footer>
</body>
</html>
