{% extends "board/base.html" %}
{% block content %}
  <h1>Set a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Set password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or has expired.</p>
  {% endif %}
{% endblock %}
