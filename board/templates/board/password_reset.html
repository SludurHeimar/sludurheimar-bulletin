{% extends "board/base.html" %}
{% load i18n %}
{% block title %}{% trans "Reset your password" %}{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>{% trans "Reset your password" %}</h1>
    <p>{% trans "Enter your account's email and we'll send a reset link." %}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">{% trans "Send reset link" %}</button>
    </form>
  </div>
{% endblock %}
